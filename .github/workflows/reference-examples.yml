name: Database reference examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  transaction-boundary-demo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute transaction boundary demonstration
        run: python -B examples/transaction_boundary_demo.py
